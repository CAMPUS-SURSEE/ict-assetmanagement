<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Etiketten — ICT Lager</title>

<!-- Die Seitengrösse für den Druck lässt sich in CSS nicht über eine Klasse
     umschalten. Darum zwei Regelsätze, von denen jeweils einer über das
     media-Attribut scharf geschaltet wird (siehe modusSetzen()). -->
<style id="stil-einzeln" media="not all">
  @page { size: 62mm 29mm; margin: 0; }
</style>
<style id="stil-bogen" media="not all">
  @page { size: A4 portrait; margin: 10mm 8mm; }
</style>

<style>
  :root {
    --akzent: #84B819;
    --text:   #111111;
    --grau:   #6b6d68;
    --grund:  #f5f6f4;
    --karte:  #ffffff;
    --linie:  #e4e5e1;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* hidden muss staerker sein als jede display-Regel weiter unten,
     sonst bleiben ausgeblendete Knoepfe und Pillen sichtbar. */
  [hidden] { display: none !important; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--grund);
    color: var(--text);
    line-height: 1.5;
  }

  /* ---------- Bedienleiste (wird nie gedruckt) ---------- */

  .leiste {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 18px;
    padding: 14px 22px;
    background: #1a1a1a;
    color: #f2f3f0;
  }
  .leiste .titel { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.06em; }
  .leiste .anzahl { font-size: 0.82rem; color: #9a9c97; }
  .leiste .rechts { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .schalter { display: flex; border: 1px solid #3a3a3a; border-radius: 8px; overflow: hidden; }
  .schalter button {
    font: inherit;
    font-size: 0.82rem;
    padding: 7px 14px;
    background: transparent;
    color: #c9cbc5;
    border: 0;
    cursor: pointer;
  }
  .schalter button[aria-pressed="true"] { background: var(--akzent); color: #17210a; font-weight: 600; }

  .knopf {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #3a3a3a;
    background: transparent;
    color: #f2f3f0;
    cursor: pointer;
    text-decoration: none;
  }
  .knopf.haupt { background: var(--akzent); border-color: var(--akzent); color: #17210a; font-weight: 600; }
  .knopf:disabled { opacity: 0.45; cursor: default; }

  .meldung { padding: 22px; color: var(--grau); font-size: 0.95rem; }
  .meldung.fehler { color: #a13b1e; }

  /* ---------- Etiketten am Bildschirm ---------- */

  .blatt { padding: 22px; }
  .etiketten { display: flex; flex-wrap: wrap; gap: 8mm; }

  .etikette {
    width: 62mm;
    height: 29mm;
    background: #fff;
    border: 1px solid var(--linie);
    border-radius: 4px;
    padding: 2.5mm 3mm;
    display: flex;
    align-items: center;
    gap: 3mm;
    overflow: hidden;
    /* Farben auch dann drucken, wenn der Browser sparen möchte. */
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .etikette .qr { flex: none; width: 23mm; height: 23mm; }
  .etikette .qr svg { width: 100%; height: 100%; display: block; }
  .etikette .rechts { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1.5mm; }
  .etikette .logo { width: 32mm; height: auto; display: block; color: #111; }
  .etikette .mail {
    font-size: 6.6pt;
    letter-spacing: 0.01em;
    color: #333;
    overflow-wrap: anywhere;
  }

  /* ---------- Druck ---------- */

  @media print {
    body { background: #fff; }
    /* Bedienleiste und JEDE Meldung — auch die Fehlermeldung — bleiben aussen
       vor. Eine mitgedruckte Meldung würde die erste Etikette verschieben. */
    .leiste, .meldung { display: none !important; }
    .blatt { padding: 0; }
    .etikette { border: 0; border-radius: 0; }

    /* Etikettendrucker: genau eine Etikette pro Seite. */
    body.modus-einzeln .etiketten { display: block; gap: 0; }
    body.modus-einzeln .etikette {
      width: 62mm;
      height: 29mm;
      page-break-after: always;
      break-after: page;
    }
    body.modus-einzeln .etikette:last-child { page-break-after: auto; break-after: auto; }

    /* A4-Bogen: drei Spalten, Etiketten nie über den Seitenumbruch reissen. */
    body.modus-bogen .etiketten { display: flex; flex-wrap: wrap; gap: 4mm; }
    body.modus-bogen .etikette {
      border: 1px dashed #ccc;
      page-break-inside: avoid;
      break-inside: avoid;
    }
  }
</style>
</head>
<body class="modus-bogen">

<div class="leiste">
  <span class="titel">Etiketten drucken</span>
  <span class="anzahl" id="anzahl"></span>
  <div class="rechts">
    <div class="schalter" role="group" aria-label="Druckformat">
      <button type="button" id="btn-einzeln" aria-pressed="false">Etikettendrucker</button>
      <button type="button" id="btn-bogen"   aria-pressed="true">A4-Bogen</button>
    </div>
    <a class="knopf" href="admin.html">Zurück</a>
    <button type="button" class="knopf haupt" id="btn-drucken" disabled>Drucken</button>
  </div>
</div>

<p class="meldung" id="meldung">Anmeldung wird geprüft …</p>

<div class="blatt">
  <div class="etiketten" id="etiketten"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"
        integrity="sha384-RGxxfG5yRS8DLU7ZJ8OoLhbV/BsJFHyPuMVHrTLbpj3t5Z15LnviJmaznKY/a7LZ"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"
        integrity="sha384-lQXOAyZwHXE55JFyrOMB7nY2Wv+m5ZWNtJcHrd1rceRQXAYNLak8ukN5TjBTcIwz"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="konfig.js"></script>
<script src="auth.js"></script>
<script src="graph.js"></script>
<script>
"use strict";

/* ====================================================================
   etikette.html — Druckansicht der Geräteetiketten.

   Aufruf: etikette.html?ids=12,13,14

   Auf der Etikette steht bewusst NUR der QR-Code, das Logo und die Adresse
   des Servicedesks. Kein Gerätename, keine Nummer, keine Seriennummer — eine
   Etikette klebt an einem Gerät, das herumgereicht wird, und soll nichts
   verraten. Wer wissen will, um welches Gerät es sich handelt, scannt den
   Code und landet auf der öffentlichen Seite.

   Der QR-Code enthält https://ictlager.campus-sursee.ch/g/{id}.

   Die Seite liest über Microsoft Graph und braucht darum eine Anmeldung.
   Streng genommen bräuchte sie für den QR-Code nur die IDs; die Geräte
   werden trotzdem geladen, damit beim Druck geprüft ist, dass es die IDs
   wirklich gibt.
   ==================================================================== */

const el = id => document.getElementById(id);

/* ---------- Druckformat umschalten ---------- */

function modusSetzen(modus) {
  const einzeln = modus === "einzeln";
  document.body.className = einzeln ? "modus-einzeln" : "modus-bogen";
  el("stil-einzeln").media = einzeln ? "print" : "not all";
  el("stil-bogen").media   = einzeln ? "not all" : "print";
  el("btn-einzeln").setAttribute("aria-pressed", einzeln ? "true" : "false");
  el("btn-bogen").setAttribute("aria-pressed", einzeln ? "false" : "true");
  try { localStorage.setItem("ictlager-etikettenmodus", modus); } catch (e) { /* egal */ }
}

el("btn-einzeln").addEventListener("click", () => modusSetzen("einzeln"));
el("btn-bogen").addEventListener("click", () => modusSetzen("bogen"));
el("btn-drucken").addEventListener("click", () => window.print());

(function modusWiederherstellen() {
  let gemerkt = null;
  try { gemerkt = localStorage.getItem("ictlager-etikettenmodus"); } catch (e) { /* egal */ }
  modusSetzen(gemerkt === "einzeln" ? "einzeln" : "bogen");
})();


/* ---------- Logo ---------- */

/* Wird für jede Etikette einmal geklont, statt den langen Pfad mehrfach in
   das Dokument zu schreiben. */

  const h = document.createElement("div");
  h.innerHTML = '<svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710.4 168.6" role="img" aria-label="Campus Sursee"><path fill="currentColor" d="M37.4 12c10.9 0 20.2 5.9 23.8 15.1l.4 1.1 11.7-5.3-.4-1C67.4 8.4 53.8 0 37.3 0 20 0 4.7 10.3.1 25.1L0 55.2l.1.3C4.7 70.3 20 80.6 37.3 80.6c16.4 0 30.1-8.4 35.6-21.9l.4-1-11.7-5.3-.4 1.1c-3.6 9.2-12.9 15.1-23.8 15.1-11.4 0-21.8-7.1-24.5-16.6V28.6C15.5 19.1 26 12 37.4 12zM307.4.8H275v78h12.8V51.5h19.6c11.7 0 22.6-6.8 25.8-16.1l.1-18.3-.1-.4C330 7.6 319.1.8 307.4.8zm12.9 19.7V32c-2 4.6-7.6 7.8-13.7 7.8h-18.8V12.7h18.8c6.1 0 11.7 3.2 13.7 7.8zM400.9 59.4c-2.1 4.6-8.6 9.1-18.5 9.1-9.7 0-16.3-4.5-18.5-9.1V.8h-12.8v62.6l.1.2c4.2 10 16.7 16.8 31.2 16.8 14.4 0 27-6.7 31.3-16.8l.1-.2V.8h-12.9v58.6zM212.4 49.9 187.5.8h-16.9v78.1H183V18.5l24.7 48.4h9.3l24.7-48.4v60.4h12.5V.8h-17zM461.5 80.5c13.3 0 24.9-6.5 29-16.1l.1-.2V50.5l-.1-.2c-2.6-6.3-8.5-11.4-16.2-13.9-4.5-1.6-8.1-2.1-11.6-2.6-2.9-.4-5.7-.8-8.8-1.8-4.3-1.5-7-3.5-8.4-6.5v-5.6c2.3-4.9 8.3-8.1 15.5-8.1 8.4 0 15.3 4.3 18.3 11.4l.5 1.1 11.4-5.4-.4-1C486.6 7 475 0 461.2 0c-12.9 0-24.3 6.5-28.3 16.2l-.1.2v12.4l.1.4c2.4 6.2 8.1 11.1 16.1 13.8 4.4 1.5 7.9 2 11.2 2.4 3 .4 5.9.8 9.1 1.9 4.2 1.4 6.9 3.6 8.4 6.7v6.4c-2.3 5-8.6 8.2-16.2 8.2-8.8 0-16-4.4-19.2-11.9l-.5-1.1-11.1 5.8.4.9c4.2 11 16.4 18.2 30.4 18.2zM112.8.8 82.8 75v3.8h12l7.3-18.6h36.2l7.3 18.6h12.2v-3.9L127.8.8h-15zm20.9 47.7h-26.9l13.5-34 13.4 34zM710.4 101V89H656v78h54.4v-12h-41.6v-21.5h38.4v-11.9h-38.4V101zM303.7 99.9c8.4 0 15.3 4.3 18.3 11.4l.5 1.1 11.4-5.4-.4-1c-4.2-10.9-15.9-17.9-29.6-17.9-12.9 0-24.3 6.5-28.3 16.2l-.1.2v12.4l.1.4c2.4 6.2 8.1 11.1 16.1 13.8 4.4 1.5 7.9 2 11.2 2.4 3 .4 5.9.8 9.1 1.9 4.2 1.4 6.9 3.6 8.4 6.7v6.4c-2.3 5-8.6 8.2-16.2 8.2-8.8 0-16-4.4-19.2-11.8l-.5-1.1-11.1 5.8.4 1c4.2 10.7 16.5 17.9 30.5 17.9 13.3 0 24.9-6.5 29-16.1l.1-.2v-13.7l-.1-.2c-2.6-6.3-8.5-11.4-16.2-13.9-4.5-1.6-8.1-2.1-11.6-2.6-2.9-.4-5.7-.8-8.8-1.8-4.3-1.5-7-3.5-8.4-6.5v-5.6c2.1-4.8 8.2-8 15.4-8zM537.5 99.9c8.4 0 15.3 4.3 18.3 11.4l.5 1.1 11.4-5.4-.4-1c-4.2-10.9-15.8-17.9-29.6-17.9-12.9 0-24.3 6.5-28.3 16.2l-.1.2v12.4l.1.4c2.4 6.2 8.1 11.1 16.1 13.8 4.4 1.5 7.9 2 11.2 2.4 3 .4 5.9.8 9.1 1.9 4.2 1.4 6.9 3.6 8.4 6.7v6.4c-2.3 5-8.6 8.2-16.2 8.2-8.8 0-16-4.4-19.2-11.8l-.5-1.1-11.1 5.8.4.9c4.2 10.7 16.5 17.9 30.5 17.9 13.3 0 24.9-6.5 29-16.1l.1-.2v-13.7l-.1-.2c-2.6-6.3-8.5-11.4-16.2-13.9-4.5-1.6-8.1-2.1-11.6-2.6-2.9-.4-5.7-.8-8.8-1.8-4.3-1.5-7-3.5-8.4-6.5v-5.6c2.1-4.7 8.1-7.9 15.4-7.9zM491.3 121.3l.1-15.9-.1-.4c-3.2-9.3-14-16-25.7-16h-33.8v78h12.8v-29.6h16.8L481 167h12.4v-4l-18.3-27.2c7.8-2.6 13.9-8 16.2-14.5zm-12.8-12.7v9.4c-2 4.6-7.6 7.8-13.7 7.8h-20.2v-25h20.2c6.2 0 11.8 3.2 13.7 7.8zM583.6 167h54.5v-12h-41.7v-21.5h38.4v-11.9h-38.4V101h41.7V89h-54.5zM400.8 147.5c-2.1 4.6-8.6 9.1-18.5 9.1-9.7 0-16.3-4.5-18.5-9.1V89H351v62.6l.1.2c4.2 10 16.7 16.8 31.2 16.8 14.4 0 27-6.7 31.3-16.8l.1-.2V88.9h-12.9v58.6z"/><path fill="#84B819" d="M511.2 83.8c0-6.3-5.1-11.4-11.4-11.4-6.3 0-11.4 5.1-11.4 11.4s5.1 11.4 11.4 11.4c6.3-.1 11.4-5.1 11.4-11.4z"/></svg>';
  return h.firstChild;
})();


/* ---------- eine Etikette bauen ---------- */

function etiketteBauen(id) {
  const kasten = document.createElement("div");
  kasten.className = "etikette";

  // QR-Code. Die Bibliothek qrcode-generator erzeugt ein fertiges SVG.
  // Fehlerkorrektur «M» reicht; die Adresse ist kurz.
  const qrBox = document.createElement("div");
  qrBox.className = "qr";
  const adresse = Hilfe.geraetLink(id);
  try {
    const qr = qrcode(0, "M");
    qr.addData(adresse);
    qr.make();
    // createSvgTag liefert nur Rechtecke und Pfade, keine fremden Daten.
    qrBox.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch (e) {
    qrBox.textContent = "QR-Fehler";
  }

  const rechts = document.createElement("div");
  rechts.className = "rechts";
  rechts.appendChild(LOGO_VORLAGE.cloneNode(true));

  const mail = document.createElement("div");
  mail.className = "mail";
  mail.textContent = (KONFIG && KONFIG.servicedeskMail) || "servicedesk@campus-sursee.ch";
  rechts.appendChild(mail);

  kasten.appendChild(qrBox);
  kasten.appendChild(rechts);
  return kasten;
}


/* ---------- Ablauf ---------- */

function meldung(text, istFehler) {
  const m = el("meldung");
  m.textContent = text;
  m.className = "meldung" + (istFehler ? " fehler" : " hinweis");
  m.hidden = !text;
}

async function starten() {
  const roh = new URLSearchParams(location.search).get("ids") || "";
  const ids = roh.split(",").map(s => s.trim()).filter(s => /^\d+$/.test(s));

  if (!ids.length) {
    meldung("Keine Geräte ausgewählt. Bitte in der Verwaltung unter "
      + "«Etiketten» Geräte auswählen.", true);
    return;
  }

  try {
    await Auth.anmeldungSicherstellen();
  } catch (e) {
    meldung("Anmeldung fehlgeschlagen: " + ((e && e.message) || e), true);
    return;
  }

  meldung("Geräte werden geprüft …", false);

  let bekannt = new Set(ids);
  try {
    const alle = await Graph.geraete();
    const vorhanden = new Set(alle.map(g => String(g.id)));
    const fehlend = ids.filter(i => !vorhanden.has(i));
    bekannt = new Set(ids.filter(i => vorhanden.has(i)));
    if (fehlend.length) {
      meldung("Für " + fehlend.length + " ausgewählte Nummer(n) besteht kein "
        + "Gerät mehr (" + fehlend.join(", ") + "). Diese werden übersprungen.", true);
    } else {
      meldung("", false);
    }
  } catch (e) {
    // Der QR-Code hängt nicht an den Gerätedaten. Lieber drucken als scheitern.
    meldung("Die Geräte konnten nicht geprüft werden (" + ((e && e.message) || e)
      + "). Die Etiketten werden trotzdem erzeugt.", true);
  }

  const ziel = el("etiketten");
  ziel.textContent = "";
  let anzahl = 0;
  for (const id of ids) {
    if (!bekannt.has(id)) continue;
    ziel.appendChild(etiketteBauen(id));
    anzahl++;
  }

  el("anzahl").textContent = anzahl === 1 ? "1 Etikette" : anzahl + " Etiketten";
  el("btn-drucken").disabled = anzahl === 0;
}

starten();
</script>
</body>
</html>
