<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Gerät — ICT Campus Sursee</title>
<style>
  :root {
    --akzent:  #84B819;
    --text:    #111111;
    --grau:    #6b6d68;
    --grund:   #f5f6f4;
    --karte:   #ffffff;
    --linie:   #e4e5e1;
    --radius:  10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* hidden muss staerker sein als jede display-Regel weiter unten,
     sonst bleiben ausgeblendete Knoepfe und Pillen sichtbar. */
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--grund);
    color: var(--text);
    line-height: 1.5;
    padding: 20px 16px 40px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  header { padding: 8px 0 22px; }
  .logo { width: 150px; height: auto; display: block; color: var(--text); }

  .karte {
    background: var(--karte);
    border: 1px solid var(--linie);
    border-radius: var(--radius);
    padding: 22px 20px;
  }
  .karte + .karte { margin-top: 14px; }

  .lade, .fehler { color: var(--grau); font-size: 0.95rem; }
  .fehler strong { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 6px; }

  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .marken { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .marke {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 500;
    border: 1px solid var(--linie);
    background: #fafbf9;
    color: var(--grau);
  }
  .marke.status-aktiv        { background: #f2f8e4; border-color: #d9e9b4; color: #4a6a08; }
  .marke.status-lager        { background: #f1f2ef; border-color: #dfe1db; color: #4a4c47; }
  .marke.status-reparatur    { background: #fdf3e6; border-color: #f0dcc0; color: #7a5210; }
  .marke.status-ausgemustert { background: #f5f5f5; border-color: #e3e3e3; color: #7a7a7a; }

  dl { margin-top: 20px; border-top: 1px solid var(--linie); }
  .zeile {
    display: flex;
    gap: 16px;
    padding: 11px 0;
    border-bottom: 1px solid var(--linie);
    font-size: 0.94rem;
  }
  dt { flex: none; width: 110px; color: var(--grau); }
  dd { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  .beschreibung {
    margin-top: 18px;
    font-size: 0.94rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .kontakt h2 {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--grau);
  }
  .kontakt p { margin-top: 10px; font-size: 0.94rem; }
  .kontakt .aktionen { margin-top: 16px; display: grid; gap: 10px; }
  .kontakt a.knopf {
    display: block;
    text-align: center;
    padding: 13px 16px;
    border-radius: var(--radius);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    border: 1px solid var(--linie);
    color: var(--text);
    background: #fff;
  }
  .kontakt a.knopf.haupt {
    background: var(--akzent);
    border-color: var(--akzent);
    color: #17210a;
  }

  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 0.78rem;
    color: #9a9c97;
  }
</style>
</head>
<body>

<div class="wrap">

  </header>

  <!-- Zustand 1: wird geladen -->
  <section class="karte" id="k-laden">
    <p class="lade">Gerät wird geladen …</p>
  </section>

  <!-- Zustand 2: Fehler -->
  <section class="karte" id="k-fehler" hidden>
    <p class="fehler"><strong id="fehler-titel">Gerät nicht gefunden</strong>
      <span id="fehler-text"></span></p>
  </section>

  <!-- Zustand 3: Gerät -->
  <section class="karte" id="k-geraet" hidden>
    <h1 id="g-name"></h1>
    <div class="marken">
      <span class="marke" id="g-kategorie" hidden></span>
      <span class="marke" id="g-status" hidden></span>
    </div>
    <dl id="g-liste"></dl>
    <p class="beschreibung" id="g-beschreibung" hidden></p>
  </section>

  <!-- Kontakt: immer sichtbar -->
  <section class="karte kontakt">
    <h2>ICT Servicedesk</h2>
    <p>Gerät gefunden oder defekt? Melde dich beim ICT Servicedesk
       von Campus Sursee.</p>
    <div class="aktionen">
      <a class="knopf haupt" id="kontakt-mail" href="mailto:servicedesk@campus-sursee.ch">servicedesk@campus-sursee.ch</a>
      <a class="knopf" href="tel:+41419262369">+41 41 926 23 69</a>
    </div>
  </section>

  <footer>Campus Sursee — Informatik</footer>

<script src="konfig.js"></script>
<script>
"use strict";

/* ====================================================================
   geraet.html — öffentliche Geräteseite, ohne Anmeldung.

   Ziel dieser Seite: wer die Etikette auf einem Gerät scannt, soll wissen,
   um welches Gerät es sich handelt und wen er anrufen kann. Mehr nicht.

   Sicherheit: die Seite spricht NICHT mit Microsoft Graph. Sie ruft einen
   anonymen Power-Automate-Flow auf, der ausschliesslich die sechs
   öffentlichen Felder zurückgibt. Interne Angaben (Seriennummer, IP, MAC,
   Owner, Preis, Notizen, Daten) verlassen SharePoint gar nie — sie sind
   nicht Teil der Flow-Antwort und können darum auch nicht ausgelesen werden.

   Der Aufruf ist ein «simple request» im Sinne von CORS: GET, keine eigenen
   Kopfzeilen. Damit fragt der Browser vorher nicht per OPTIONS nach, was ein
   anonymer Flow ohnehin nicht beantworten würde.
   ==================================================================== */

const el = id => document.getElementById(id);

/* Alles, was von aussen kommt, wird ausschliesslich über textContent gesetzt.
   Damit ist Cross-Site-Scripting ausgeschlossen — kein Feld landet je als
   HTML im Dokument. */

function zeige(welche) {
  el("k-laden").hidden  = welche !== "laden";
  el("k-fehler").hidden = welche !== "fehler";
  el("k-geraet").hidden = welche !== "geraet";
}

function fehler(titel, text) {
  el("fehler-titel").textContent = titel;
  el("fehler-text").textContent = text || "";
  zeige("fehler");
}

/* Fügt eine Zeile «Bezeichnung / Wert» an, sofern ein Wert vorhanden ist. */
function zeile(bezeichnung, wert) {
  if (!wert) return;
  const box = document.createElement("div");
  box.className = "zeile";
  const dt = document.createElement("dt");
  dt.textContent = bezeichnung;
  const dd = document.createElement("dd");
  dd.textContent = wert;
  box.appendChild(dt);
  box.appendChild(dd);
  el("g-liste").appendChild(box);
}

function marke(knotenId, wert, statusKlasse) {
  const k = el(knotenId);
  if (!wert) { k.hidden = true; return; }
  k.textContent = wert;
  k.className = "marke" + (statusKlasse ? " status-" + statusKlasse : "");
  k.hidden = false;
}

/* Erlaubte Statuswerte, damit aus dem Flow kein beliebiger Klassenname in
   das class-Attribut wandert. */
const STATUS_KLASSEN = {
  "Aktiv": "aktiv",
  "Lager": "lager",
  "Reparatur": "reparatur",
  "Ausgemustert": "ausgemustert"
};

function darstellen(d) {
  document.title = (d.name || "Gerät") + " — ICT Campus Sursee";

  el("g-name").textContent = d.name || "Gerät ohne Namen";
  marke("g-kategorie", d.kategorie || "", null);
  marke("g-status", d.status || "", STATUS_KLASSEN[d.status] || null);

  zeile("Hersteller", d.hersteller || "");
  zeile("Modell", d.modell || "");

  const b = el("g-beschreibung");
  if (d.beschreibung) {
    b.textContent = d.beschreibung;
    b.hidden = false;
  }

  zeige("geraet");
}

/* Betreffzeile der Mail vorbereiten, damit der Servicedesk gleich sieht,
   um welches Gerät es geht. */
function mailVorbereiten(id, name) {
  const adresse = (typeof KONFIG !== "undefined" && KONFIG.servicedeskMail)
    ? KONFIG.servicedeskMail : "servicedesk@campus-sursee.ch";
  const betreff = "ICT-Gerät " + (name ? name + " " : "") + "(ID " + id + ")";
  el("kontakt-mail").href = "mailto:" + adresse
    + "?subject=" + encodeURIComponent(betreff);
  el("kontakt-mail").textContent = adresse;
}

async function starten() {
  const id = (new URLSearchParams(location.search).get("id") || "").trim();

  if (!id) {
    fehler("Keine Geräte-Nummer angegeben",
      "Bitte den QR-Code auf der Etikette noch einmal scannen.");
    return;
  }
  mailVorbereiten(id, "");

  if (typeof KONFIG === "undefined" || !KONFIG.FLOW_GERAET_URL
      || KONFIG.FLOW_GERAET_URL.indexOf("HIER_") === 0) {
    fehler("Die Geräteauskunft ist noch nicht eingerichtet",
      "In konfig.js fehlt FLOW_GERAET_URL. Bitte beim ICT Servicedesk melden.");
    return;
  }

  let antwort;
  try {
    // Bewusst ohne eigene Kopfzeilen, siehe Kommentar oben.
    antwort = await fetch(KONFIG.FLOW_GERAET_URL + "&id=" + encodeURIComponent(id));
  } catch (e) {
    fehler("Die Geräteauskunft ist gerade nicht erreichbar",
      "Bitte die Internetverbindung prüfen und die Seite neu laden.");
    return;
  }

  if (antwort.status === 404) {
    fehler("Gerät nicht gefunden",
      "Zu dieser Nummer ist bei uns kein Gerät hinterlegt. "
      + "Wenn du das Gerät gefunden hast, melde dich trotzdem beim Servicedesk.");
    return;
  }
  if (!antwort.ok) {
    fehler("Die Geräteauskunft antwortet nicht richtig",
      "Fehler " + antwort.status + ". Bitte später noch einmal versuchen.");
    return;
  }

  let daten;
  try {
    daten = await antwort.json();
  } catch (e) {
    fehler("Unerwartete Antwort",
      "Die Geräteauskunft hat keine lesbaren Daten geliefert.");
    return;
  }

  if (!daten || daten.ok === false || (!daten.name && !daten.kategorie)) {
    fehler("Gerät nicht gefunden",
      "Zu dieser Nummer ist bei uns kein Gerät hinterlegt.");
    return;
  }

  mailVorbereiten(id, daten.name || "");
  darstellen(daten);
}

starten();
</script>
</body>
</html>
