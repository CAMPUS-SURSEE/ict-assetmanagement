<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Gerät · ICT Campus Sursee</title>
<link rel="icon" type="image/webp"
      href="https://www.campus-sursee.ch/wp-content/uploads/2023/12/campus-sursee-favicon.webp">
<style>
  /* Gestaltung: reines Weiss, Struktur ausschliesslich ueber Haarlinien,
     Abstaende und Typografie. Keine Flaechen, keine Schatten, keine
     Grautoene als Hintergrund. Farbe kommt nur vom Akzent. */
  :root {
    --akzent:     #84B819;
    --akzent-dkl: #6d9a12;
    --text:       #101208;
    --text-2:     #5f6359;
    --text-3:     #8d9187;
    --linie:      #e7e8e3;
    --linie-2:    #d2d4cc;
    --tint:       rgba(132, 184, 25, 0.07);
    --rot:        #b03a22;
    --radius:     10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* hidden muss staerker sein als jede display-Regel weiter unten,
     sonst bleiben ausgeblendete Knoepfe und Pillen sichtbar. */
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; background: #fff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding: 28px 22px 48px;
  }
  ::selection { background: rgba(132, 184, 25, 0.22); }

  .wrap { max-width: 480px; margin: 0 auto; }

  header { padding-bottom: 30px; }
  .logo { width: 150px; height: auto; display: block; }

  /* ---------- Zustaende ---------- */

  .lade, .fehler-text { color: var(--text-2); font-size: 0.94rem; }

  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.22;
    overflow-wrap: anywhere;
  }
  #k-fehler h1 { font-size: 1.25rem; margin-bottom: 8px; }

  /* ---------- Merkmale ---------- */

  .chips { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 12px 4px 10px;
    border: 1px solid var(--linie);
    border-radius: 999px;
    font-size: 0.79rem;
    font-weight: 500;
    color: var(--text-2);
    white-space: nowrap;
  }
  .chip::before {
    content: "";
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-3);
  }
  .chip.status-aktiv::before        { background: var(--akzent); }
  .chip.status-lager::before        { background: #8a8f85; }
  .chip.status-reparatur::before    { background: #d98324; }
  .chip.status-ausgemustert::before { background: #c6c9c1; }

  dl { margin-top: 26px; }
  dl:empty { display: none; }
  .zeile {
    display: flex;
    gap: 18px;
    padding: 12px 0;
    border-top: 1px solid var(--linie);
    font-size: 0.92rem;
  }
  dt { flex: none; width: 108px; color: var(--text-3); }
  dd { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  .beschreibung {
    margin-top: 22px;
    font-size: 0.92rem;
    color: var(--text-2);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  /* ---------- Kontakt ---------- */

  .kontakt {
    margin-top: 40px;
    padding-top: 28px;
    border-top: 1px solid var(--linie);
  }
  .kontakt h2 {
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .kontakt p { margin-top: 8px; font-size: 0.9rem; color: var(--text-2); }
  .kontakt .aktionen { margin-top: 18px; display: grid; gap: 8px; }

  a.knopf {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 14px 16px;
    border: 1px solid var(--linie);
    border-radius: var(--radius);
    text-decoration: none;
    font-size: 0.93rem;
    font-weight: 500;
    color: var(--text);
    overflow-wrap: anywhere;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  a.knopf svg {
    flex: none;
    width: 17px;
    height: 17px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.55;
  }
  a.knopf:hover { border-color: var(--linie-2); background: var(--tint); }
  a.knopf.haupt {
    background: var(--akzent);
    border-color: var(--akzent);
    color: #17210a;
  }
  a.knopf.haupt svg { opacity: 0.7; }
  a.knopf.haupt:hover { background: var(--akzent-dkl); border-color: var(--akzent-dkl); }
  a.knopf:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }

  footer {
    margin-top: 34px;
    padding-top: 20px;
    border-top: 1px solid var(--linie);
    font-size: 0.78rem;
    color: var(--text-3);
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <img class="logo" width="710" height="169" alt="Campus Sursee"
         src="https://www.campus-sursee.ch/wp-content/themes/campus-sursee/assets/images/Campus_Sursee_Hauptlogo_RGB.svg">
  </header>

  <!-- Zustand 1: wird geladen -->
  <section id="k-laden">
    <p class="lade">Gerät wird geladen …</p>
  </section>

  <!-- Zustand 2: Fehler -->
  <section id="k-fehler" hidden>
    <h1 id="fehler-titel">Gerät nicht gefunden</h1>
    <p class="fehler-text" id="fehler-text"></p>
  </section>

  <!-- Zustand 3: Gerät -->
  <section id="k-geraet" hidden>
    <h1 id="g-name"></h1>
    <div class="chips">
      <span class="chip" id="g-kategorie" hidden></span>
      <span class="chip" id="g-status" hidden></span>
    </div>
    <dl id="g-liste"></dl>
    <p class="beschreibung" id="g-beschreibung" hidden></p>
  </section>

  <!-- Kontakt: immer sichtbar -->
  <section class="kontakt">
    <h2>ICT Servicedesk</h2>
    <p>Gerät gefunden oder defekt? Melde dich beim ICT Servicedesk
       von Campus Sursee.</p>
    <div class="aktionen">
      <a class="knopf haupt" id="kontakt-mail" href="mailto:servicedesk@campus-sursee.ch">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>
        </svg>
        <span>servicedesk@campus-sursee.ch</span>
      </a>
      <a class="knopf" href="tel:+41419262369">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5.5 5.5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 5 5.7 2 2 0 0 1 7 3.5z"/>
        </svg>
        <span>+41 41 926 23 69</span>
      </a>
    </div>
  </section>

  <footer>Campus Sursee · Informatik</footer>

</div>

<script src="konfig.js"></script>
<script>
"use strict";

/* ====================================================================
   geraet.html, oeffentliche Geraeteseite, ohne Anmeldung.

   Ziel dieser Seite: wer die Etikette auf einem Gerät scannt, soll wissen,
   um welches Gerät es sich handelt und wen er anrufen kann. Mehr nicht.

   Sicherheit: die Seite spricht NICHT mit Microsoft Graph. Sie ruft einen
   anonymen Power-Automate-Flow auf, der ausschliesslich die sechs
   öffentlichen Felder zurückgibt. Interne Angaben (Seriennummer, IP, MAC,
   Owner, Preis, Notizen, Daten) verlassen SharePoint gar nie: sie sind
   nicht Teil der Flow-Antwort und können darum auch nicht ausgelesen werden.

   Der Aufruf ist ein «simple request» im Sinne von CORS: GET, keine eigenen
   Kopfzeilen. Damit fragt der Browser vorher nicht per OPTIONS nach, was ein
   anonymer Flow ohnehin nicht beantworten würde.
   ==================================================================== */

const el = id => document.getElementById(id);

/* Alles, was von aussen kommt, wird ausschliesslich über textContent gesetzt.
   Damit ist Cross-Site-Scripting ausgeschlossen: kein Feld landet je als
   HTML im Dokument. */

function zeige(welche) {
  el("k-laden").hidden  = welche !== "laden";
  el("k-fehler").hidden = welche !== "fehler";
  el("k-geraet").hidden = welche !== "geraet";
}

function fehler(titel, text) {
  el("fehler-titel").textContent = titel;
  el("fehler-text").textContent = text || "";
  zeige("fehler");
}

/* Fügt eine Zeile «Bezeichnung / Wert» an, sofern ein Wert vorhanden ist. */
function zeile(bezeichnung, wert) {
  if (!wert) return;
  const box = document.createElement("div");
  box.className = "zeile";
  const dt = document.createElement("dt");
  dt.textContent = bezeichnung;
  const dd = document.createElement("dd");
  dd.textContent = wert;
  box.appendChild(dt);
  box.appendChild(dd);
  el("g-liste").appendChild(box);
}

function chip(knotenId, wert, statusKlasse) {
  const k = el(knotenId);
  if (!wert) { k.hidden = true; return; }
  k.textContent = wert;
  k.className = "chip" + (statusKlasse ? " status-" + statusKlasse : "");
  k.hidden = false;
}

/* Erlaubte Statuswerte, damit aus dem Flow kein beliebiger Klassenname in
   das class-Attribut wandert. */
const STATUS_KLASSEN = {
  "Aktiv": "aktiv",
  "Lager": "lager",
  "Reparatur": "reparatur",
  "Ausgemustert": "ausgemustert"
};

function darstellen(d) {
  document.title = (d.name || "Gerät") + " · ICT Campus Sursee";

  el("g-name").textContent = d.name || "Gerät ohne Namen";
  chip("g-kategorie", d.kategorie || "", null);
  chip("g-status", d.status || "", STATUS_KLASSEN[d.status] || null);

  zeile("Hersteller", d.hersteller || "");
  zeile("Modell", d.modell || "");

  const b = el("g-beschreibung");
  if (d.beschreibung) {
    b.textContent = d.beschreibung;
    b.hidden = false;
  }

  zeige("geraet");
}

/* Betreffzeile der Mail vorbereiten, damit der Servicedesk gleich sieht,
   um welches Gerät es geht. */
function mailVorbereiten(id, name) {
  const adresse = (typeof KONFIG !== "undefined" && KONFIG.servicedeskMail)
    ? KONFIG.servicedeskMail : "servicedesk@campus-sursee.ch";
  const betreff = "ICT-Gerät " + (name ? name + " " : "") + "(ID " + id + ")";
  el("kontakt-mail").href = "mailto:" + adresse
    + "?subject=" + encodeURIComponent(betreff);
  el("kontakt-mail").lastElementChild.textContent = adresse;
}

async function starten() {
  const id = (new URLSearchParams(location.search).get("id") || "").trim();

  if (!id) {
    fehler("Keine Geräte-Nummer angegeben",
      "Bitte den QR-Code auf der Etikette noch einmal scannen.");
    return;
  }
  mailVorbereiten(id, "");

  if (typeof KONFIG === "undefined" || !KONFIG.FLOW_GERAET_URL
      || KONFIG.FLOW_GERAET_URL.indexOf("HIER_") === 0) {
    fehler("Die Geräteauskunft ist noch nicht eingerichtet",
      "In konfig.js fehlt FLOW_GERAET_URL. Bitte beim ICT Servicedesk melden.");
    return;
  }

  let antwort;
  try {
    // Bewusst ohne eigene Kopfzeilen, siehe Kommentar oben.
    antwort = await fetch(KONFIG.FLOW_GERAET_URL + "&id=" + encodeURIComponent(id));
  } catch (e) {
    fehler("Die Geräteauskunft ist gerade nicht erreichbar",
      "Bitte die Internetverbindung prüfen und die Seite neu laden.");
    return;
  }

  if (antwort.status === 404) {
    fehler("Gerät nicht gefunden",
      "Zu dieser Nummer ist bei uns kein Gerät hinterlegt. "
      + "Wenn du das Gerät gefunden hast, melde dich trotzdem beim Servicedesk.");
    return;
  }
  if (!antwort.ok) {
    fehler("Die Geräteauskunft antwortet nicht richtig",
      "Fehler " + antwort.status + ". Bitte später noch einmal versuchen.");
    return;
  }

  let daten;
  try {
    daten = await antwort.json();
  } catch (e) {
    fehler("Unerwartete Antwort",
      "Die Geräteauskunft hat keine lesbaren Daten geliefert.");
    return;
  }

  if (!daten || daten.ok === false || (!daten.name && !daten.kategorie)) {
    fehler("Gerät nicht gefunden",
      "Zu dieser Nummer ist bei uns kein Gerät hinterlegt.");
    return;
  }

  mailVorbereiten(id, daten.name || "");
  darstellen(daten);
}

starten();
</script>
</body>
</html>
